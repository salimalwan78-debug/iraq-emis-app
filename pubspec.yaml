name: iraq_emis
description: A new Flutter project for Iraq EMIS System.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.2
  http: ^1.1.0
  webview_flutter: ^4.4.2
  audioplayers: ^5.2.1
  video_player: ^2.8.2

  # الكاميرا واختيار الصور
  image_picker: ^1.0.7

  # فك ملف ZIP الناتج من مسار Free في remove.bg
  archive: ^4.0.7

  # التخزين المحلي
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/avatar.png
    - assets/relax.mp3
    - assets/intro.mp4
