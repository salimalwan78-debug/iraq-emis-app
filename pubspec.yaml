name: emis_student_manager
description: EMIS student management application with local ML Kit selfie segmentation background removal.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP requests to EMIS API. Pinned for Dart 3.3 / Flutter 3.19.
  http: 1.2.2

  # Camera / Gallery. Pinned for Dart 3.3 / Flutter 3.19.
  image_picker: 1.1.2

  # Image decoding, resizing and PNG/JPEG encoding.
  image: 4.10.1

  # Local on-device person/background segmentation.
  # 0.9.0 supports Dart 2.16+ and avoids the newer Flutter/Dart requirements.
  google_mlkit_selfie_segmentation: 0.9.0

  cupertino_icons: 1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # 3.0.2 supports Dart 3.1+, including Dart 3.3.4.
  flutter_lints: 3.0.2

flutter:
  uses-material-design: true
