name: emis_student_manager
description: EMIS student management application with local ML Kit selfie segmentation background removal.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP requests to EMIS API
  http: ^1.5.0

  # Camera / Gallery
  image_picker: ^1.2.0

  # Image decoding, resizing and PNG/JPEG encoding
  image: ^4.10.1

  # Local on-device person/background segmentation.
  # Version 0.10.1 supports Dart 3.8+ and avoids the newer
  # Flutter 3.44 / Dart 3.12 requirement of 0.12.x.
  google_mlkit_selfie_segmentation: ^0.10.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
