import 'dart:async';
import 'package:flutter/material.dart';
import 'package:video_player/video_player.dart';
import 'emis_webview_screen.dart';

class IntroScreen extends StatefulWidget {
  const IntroScreen({super.key});

  @override
  State<IntroScreen> createState() => _IntroScreenState();
}

class _IntroScreenState extends State<IntroScreen> {
  late VideoPlayerController _controller;
  bool _isInitialized = false;
  Timer? _fallbackTimer;

  @override
  void initState() {
    super.initState();
    _initVideoPlayer();
  }

  Future<void> _initVideoPlayer() async {
    _controller = VideoPlayerController.asset('assets/intro.mp4');

    try {
      await _controller.initialize();
      if (mounted) {
        setState(() {
          _isInitialized = true;
        });
        await _controller.play();
        _controller.setLooping(false);

        // مؤقت أمان احتياطي لمدة 5 ثوانٍ (مدّة الفيديو تقريباً)
        // يضمن الانتقال التلقائي للمتصفح حتى لو تجمد مشغل أندرويد بسبب الترميز
        _fallbackTimer = Timer(const Duration(seconds: 5), () {
          _navigateToWebView();
        });
      }
    } catch (e) {
      _navigateToWebView();
    }

    // مراقبة انتهاء الفيديو الطبيعية
    _controller.addListener(() {
      if (_controller.value.isInitialized &&
          _controller.value.position >= _controller.value.duration) {
        _fallbackTimer?.cancel();
        _navigateToWebView();
      }
    });
  }

  void _navigateToWebView() {
    _fallbackTimer?.cancel();
    if (mounted) {
      Navigator.pushReplacement(
        context,
        MaterialPageRoute(builder: (context) => const EmisWebviewScreen()),
      );
    }
  }

  @override
  void dispose() {
    _fallbackTimer?.cancel();
    _controller.dispose();
    super.dispose();
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      backgroundColor: Colors.black,
      body: Center(
        child: _isInitialized
            ? SizedBox.expand(
                child: FittedBox(
                  fit: BoxFit.cover,
                  child: SizedBox(
                    width: _controller.value.size.width,
                    height: _controller.value.size.height,
                    child: VideoPlayer(_controller),
                  ),
                ),
              )
            : const CircularProgressIndicator(color: Colors.white),
      ),
    );
  }
}
